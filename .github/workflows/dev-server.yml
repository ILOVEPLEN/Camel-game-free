name: 🏀 Project Ball — Dev Server

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: 'Minutes to keep server alive (max 30)'
        default: '20'
        required: false
  push:
    branches: [main]
    paths: ['.github/workflows/dev-server.yml']

jobs:
  serve:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: claude/basketball-training-app-mvp-tivEA

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install SDK 51 base packages
        working-directory: project-ball
        run: npm install --legacy-peer-deps

      - name: Upgrade to Expo SDK 54
        working-directory: project-ball
        run: |
          npm install expo@~54.0.0 --legacy-peer-deps
          npx expo install react-native react expo-status-bar react-native-safe-area-context react-native-screens react-native-svg @react-native-async-storage/async-storage --legacy-peer-deps

      - name: Install Expo ngrok
        run: npm install -g @expo/ngrok@^4.1.0

      - name: Start server and get URL
        working-directory: project-ball
        env:
          MINUTES: ${{ github.event.inputs.minutes || '20' }}
          EXPO_NO_TELEMETRY: 1
        run: |
          npx expo start --tunnel 2>&1 | sed 's/\x1b\[[0-9;]*[mGKHFJA-Z]//g' | tee /tmp/expo.log &

          echo "Waiting for tunnel URL..."
          TUNNEL_URL=""
          for i in $(seq 1 50); do
            sleep 3

            FOUND=$(grep -oE 'exp://[a-zA-Z0-9._-]+\.[a-zA-Z0-9._-]+' /tmp/expo.log | grep -v localhost | head -1)
            if [ -n "$FOUND" ]; then
              TUNNEL_URL="$FOUND"
              echo "Found in log: $TUNNEL_URL"
              break
            fi

            NGROK_URL=$(curl -sf http://localhost:4040/api/tunnels 2>/dev/null | python3 -c "import sys,json; d=json.load(sys.stdin); print(next((t['public_url'] for t in d.get('tunnels',[]) if t.get('public_url')),''))" 2>/dev/null || true)
            if [ -n "$NGROK_URL" ]; then
              HOST="${NGROK_URL#https://}"; HOST="${HOST#http://}"
              TUNNEL_URL="exp://$HOST"
              echo "Found via ngrok API: $TUNNEL_URL"
              break
            fi

            echo "Still waiting... ($i/50)"
          done

          echo "--- Full expo log ---"
          cat /tmp/expo.log

          if [ -z "$TUNNEL_URL" ]; then
            echo "ERROR: Could not get tunnel URL"
            exit 1
          fi

          ENCODED=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1],safe=''))" "$TUNNEL_URL")
          QR_IMG="https://api.qrserver.com/v1/create-qr-code/?size=500x500&ecc=M&data=$ENCODED"

          echo "## 🏀 Project Ball — Dev Server Running" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Scan with Expo Go:**" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "![QR Code]($QR_IMG)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$TUNNEL_URL\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "> Server alive for **${MINUTES} minutes**. First bundle ~60s." >> "$GITHUB_STEP_SUMMARY"

          npx qrcode-terminal "$TUNNEL_URL" || true
          echo "=================================="
          echo "EXPO URL: $TUNNEL_URL"
          echo "=================================="

          sleep $(( MINUTES * 60 ))
