name: 🏀 Project Ball — Dev Server

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: 'Minutes to keep server alive (max 30)'
        default: '20'
        required: false

jobs:
  serve:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: claude/basketball-training-app-mvp-tivEA

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: project-ball/package-lock.json

      - name: Install dependencies
        working-directory: project-ball
        run: npm ci

      - name: Install Expo ngrok
        run: npm install -g @expo/ngrok@^4.1.0

      - name: Start server and get URL
        working-directory: project-ball
        env:
          MINUTES: ${{ github.event.inputs.minutes || '20' }}
          EXPO_NO_TELEMETRY: 1
        run: |
          # Run WITHOUT CI=1 so expo prints the tunnel URL
          # Strip ANSI colour codes so grep works
          npx expo start --tunnel 2>&1 \
            | sed 's/\x1b\[[0-9;]*[mGKHFJA-Z]//g' \
            | tee /tmp/expo.log &

          echo "Waiting for tunnel URL in logs..."
          TUNNEL_URL=""
          for i in $(seq 1 50); do
            sleep 3

            # Look for exp:// URL anywhere in the log
            FOUND=$(grep -oE 'exp://[a-zA-Z0-9._-]+\.[a-zA-Z0-9._-]+' /tmp/expo.log \
                    | grep -v localhost | head -1)
            if [ -n "$FOUND" ]; then
              TUNNEL_URL="$FOUND"
              echo "Found URL after ${i}x3s: $TUNNEL_URL"
              break
            fi

            # Also try the ngrok local API as fallback
            NGROK=$(curl -s http://localhost:4040/api/tunnels 2>/dev/null \
              | python3 -c "
import sys,json
try:
  d=json.load(sys.stdin)
  for t in d.get('tunnels',[]):
    u=t.get('public_url','')
    if u: print(u); break
except: pass
" 2>/dev/null)
            if [ -n "$NGROK" ]; then
              HOST="${NGROK#https://}"; HOST="${HOST#http://}"
              TUNNEL_URL="exp://$HOST"
              echo "Found URL via ngrok API after ${i}x3s: $TUNNEL_URL"
              break
            fi

            echo "Still waiting... ($i/50)"
          done

          echo "--- Full expo log so far ---"
          cat /tmp/expo.log

          if [ -z "$TUNNEL_URL" ]; then
            echo "ERROR: Could not get tunnel URL"
            exit 1
          fi

          # Generate QR image
          ENCODED=$(python3 -c \
            "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1],safe=''))" \
            "$TUNNEL_URL")
          QR_IMG="https://api.qrserver.com/v1/create-qr-code/?size=500x500&ecc=M&data=$ENCODED"

          # Job summary
          echo "## 🏀 Project Ball — Dev Server Running" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Scan with Expo Go:**" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "![QR Code]($QR_IMG)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$TUNNEL_URL\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "> Server alive for **${MINUTES} minutes**. First bundle ~60s." >> "$GITHUB_STEP_SUMMARY"

          # ASCII QR in logs
          npx qrcode-terminal "$TUNNEL_URL" || true
          echo "=================================="
          echo "EXPO URL: $TUNNEL_URL"
          echo "=================================="

          sleep $(( MINUTES * 60 ))
