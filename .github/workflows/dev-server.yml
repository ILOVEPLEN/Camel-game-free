name: 🏀 Project Ball — Dev Server

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: 'Minutes to keep server alive (max 30)'
        default: '20'
        required: false

jobs:
  serve:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: claude/basketball-training-app-mvp-tivEA

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: project-ball/package-lock.json

      - name: Install dependencies
        working-directory: project-ball
        run: npm ci

      - name: Start Metro bundler
        working-directory: project-ball
        run: |
          EXPO_NO_TELEMETRY=1 npx expo start 2>&1 &
          echo "Waiting for Metro..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8081/status 2>/dev/null | grep -q running; then
              echo "Metro ready!"
              break
            fi
            sleep 3
          done

      - name: Tunnel + QR code
        env:
          MINUTES: ${{ github.event.inputs.minutes || '20' }}
        run: |
          # Open localtunnel on Metro's port
          npx localtunnel --port 8081 2>&1 | tee /tmp/lt.log &
          sleep 15

          LT_URL=$(grep -oE 'https://[a-z0-9-]+\.loca\.lt' /tmp/lt.log | head -1)

          echo "--- localtunnel log ---"
          cat /tmp/lt.log

          if [ -z "$LT_URL" ]; then
            echo "ERROR: No tunnel URL found"
            exit 1
          fi

          EXPO_URL="exp://${LT_URL#https://}"
          echo "Expo URL: $EXPO_URL"

          # QR code image via free API
          ENCODED=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1],safe=''))" "$EXPO_URL")
          QR_IMG="https://api.qrserver.com/v1/create-qr-code/?size=500x500&ecc=M&data=$ENCODED"

          # Write to job summary
          echo "## 🏀 Project Ball — Dev Server Running" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Scan with Expo Go:**" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "![QR Code]($QR_IMG)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$EXPO_URL\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "> Server alive for **${MINUTES} minutes**. First bundle load ~60s." >> "$GITHUB_STEP_SUMMARY"

          # ASCII QR in logs too
          npx qrcode-terminal "$EXPO_URL" || true
          echo "=================================="
          echo "EXPO URL: $EXPO_URL"
          echo "=================================="

          sleep $(( MINUTES * 60 ))
